name: macOS

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build macOS app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Install frontend dependencies
        run: sh scripts/frontend-install.sh

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Run Go tests
        run: go test ./...

      - name: Build macOS app
        run: wails build

      - name: Package DMG
        run: sh scripts/package-dmg.sh "build/bin/Zavod AI.app" "build/bin/Zavod-AI-${{ runner.os }}-${{ runner.arch }}.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: Zavod-AI-${{ runner.os }}-${{ runner.arch }}-dmg
          path: build/bin/Zavod-AI-${{ runner.os }}-${{ runner.arch }}.dmg
          if-no-files-found: error
